name: CI

# Pull request checks: build/test the .NET solution and validate the Terraform, without
# touching Azure. Deployment stays in deploy-development.yml (push to main).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  TF_VERSION: "1.9.8"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore HumidityService.sln

      - run: dotnet build HumidityService.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test HumidityService.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Merges the per-test-project reports so each layer's coverage counts every test project.
      - name: Coverage report
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path ./tools
          ./tools/reportgenerator \
            "-reports:./coverage/**/coverage.cobertura.xml" \
            "-targetdir:./coverage-report" \
            "-reporttypes:MarkdownSummaryGithub;JsonSummary" \
            "-assemblyfilters:+HumidityService.*"
          cat ./coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # CLAUDE.md: at least 80 % line coverage across the Application and Infrastructure layers.
      - name: Enforce coverage threshold
        env:
          MIN_LINE_COVERAGE: 80
        run: |
          failed=0
          for assembly in HumidityService.Application HumidityService.Infrastructure; do
            coverage=$(jq -r --arg name "$assembly" '.coverage.assemblies[] | select(.name == $name) | .coverage' ./coverage-report/Summary.json)
            if [ -z "$coverage" ]; then
              echo "::error::No coverage data for $assembly."
              failed=1
            elif awk -v c="$coverage" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit !(c < min) }'; then
              echo "::error::$assembly line coverage is $coverage %, below the required $MIN_LINE_COVERAGE %."
              failed=1
            else
              echo "$assembly line coverage: $coverage % (minimum $MIN_LINE_COVERAGE %)."
            fi
          done
          exit $failed

  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive terraform

  # Validating each root configuration also validates the modules it calls.
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/bootstrap
          - terraform/environments/development
          - terraform/environments/test
          - terraform/environments/staging
          - terraform/environments/production
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -backend=false: validate needs the providers but not the remote state, so no Azure login.
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
