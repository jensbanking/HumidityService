name: Deploy - Development

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "terraform/environments/development/**"
      - "terraform/modules/**"
      - ".github/workflows/deploy-development.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  TF_VERSION: "1.9.8"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore HumidityService.sln

      - run: dotnet build HumidityService.sln --configuration Release --no-restore

      - run: dotnet test HumidityService.sln --configuration Release --no-build

      - name: Publish Function Host
        run: >
          dotnet publish src/HumidityService.FunctionHost/HumidityService.FunctionHost.csproj
          --configuration Release --no-build --output ./publish

      - name: Zip artifact
        run: cd publish && zip -r ../function-app.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: function-app.zip
          retention-days: 7

  terraform:
    name: Terraform apply (development)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/development
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_shared_key_vault_id: ${{ vars.SHARED_KEY_VAULT_ID }}
      TF_VAR_shared_key_vault_uri: ${{ vars.SHARED_KEY_VAULT_URI }}
      TF_VAR_sql_aad_admin_login_name: ${{ vars.SQL_AAD_ADMIN_LOGIN_NAME }}
      TF_VAR_sql_aad_admin_object_id: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
      TF_VAR_danfoss_client_id: ${{ secrets.DANFOSS_CLIENT_ID }}
      TF_VAR_danfoss_client_secret: ${{ secrets.DANFOSS_CLIENT_SECRET }}
    outputs:
      resource_group_name: ${{ steps.tf-outputs.outputs.resource_group_name }}
      function_app_name: ${{ steps.tf-outputs.outputs.function_app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: >
          terraform init
          -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}"

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Capture terraform outputs
        id: tf-outputs
        run: |
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Function App code
    needs: [build-and-test, terraform]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    env:
      FUNCTION_APP_NAME: ${{ needs.terraform.outputs.function_app_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-app

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # az functionapp deploy / az functionapp deployment source config-zip are unreliable
      # against Flex Consumption's OneDeploy backend (415/503s - see e.g.
      # github.com/Azure/azure-cli/issues/33184). Azure/functions-action with sku: flexconsumption
      # is Microsoft's supported path for this plan type and targets the right endpoint. Don't set
      # scm-do-build-during-deployment / enable-oryx-build - Flex Consumption always remote-builds
      # regardless, and setting them fights that instead of working with it.
      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function-app.zip
          sku: flexconsumption
